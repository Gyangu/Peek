<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>peek app icon — Clear Slice</title>
  <desc>A single visible work surface opened by one continuous data slice.</desc>
  <!--
    Source of truth for every shipped icon: PNG, ICNS and ICO.

    The mark is deliberately flat and limited to two visual elements:
      1. the near-black app plate, edged for dark-background contrast;
      2. the blue work surface, opened by a plate-coloured negative slice.

    The slice reaches both edges of the work surface. Its 88-unit width leaves
    at least 122 source pixels in the two narrow corner lobes, so both survive
    direct rasterization at 16px instead of collapsing to a single antialiased
    pixel. No effects are baked in; platform shadows and lighting stay outside
    the editable geometry.

    Regenerate all platform assets with `pnpm icon` from the repository root.
  -->

  <!-- Layer 1: app plate. The restrained keyline keeps its boundary on a dark Dock. -->
  <rect x="96" y="96" width="832" height="832" rx="192"
        fill="#171A21" stroke="#66707A" stroke-width="12"/>

  <!-- Layer 2: the shared, visible work surface. -->
  <rect x="240" y="240" width="544" height="544" rx="144" fill="#4D9CFF"/>

  <!-- Layer 3: deterministic knockout, using the plate colour rather than an effect. -->
  <path d="M 282 612
           C 378 612 408 552 436 484
           C 464 416 510 412 582 412
           L 742 412"
        fill="none" stroke="#171A21" stroke-width="88"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
