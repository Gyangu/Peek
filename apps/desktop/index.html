<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Local resources only: MCP goes through the main process, the renderer never talks to the network.

      `script-src 'self'` is never relaxed, packages included — a package that draws
      its own view gets an iframe on its own `peek-package://` origin instead, and
      `frame-src` is the single clause that permits it. `child-src 'none'` denies
      workers by the same directive name; `object-src` / `base-uri` /
      `form-action` are three navigation and embedding paths `default-src` does
      not cover, hardened here because they cost nothing.
      See docs/design/2026-08-03-plugin-architecture.md §2.6.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src peek-package:; child-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>peek</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
